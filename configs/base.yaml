# 基础配置文件
# 定义项目当前真实生效的通用默认配置

# 数据路径
data:
  root: "./data"
  raw: "./data/raw"
  clean: "./data/clean"
  features: "./data/features"
  reports: "./data/reports"

# TuShare配置
tushare:
  max_retries: 3
  retry_delay: 1  # 秒
  rate_limit: 200  # 每分钟请求数

# 行业配置
industry:
  shenwan_level: "l1"  # 项目统一主行业口径：l1 | l2 | l3

# 交易成本配置
costs:
  commission_rate: 0.0001954  # 佣金费率，双向
  min_commission: 5  # 最小佣金，元
  stamp_tax: 0.0005  # 印花税，仅卖出
  slippage: 0.0005  # 滑点
