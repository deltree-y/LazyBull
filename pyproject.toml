[tool.poetry]
name = "lazybull"
version = "0.102.0"
description = "A股量化研究与回测框架 - 专注价值红利策略"
authors = ["deltree-y"]
packages = [{include = "lazybull", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^3.0"
numpy = "^2.0"
pyyaml = "^6.0"
python-dotenv = "^1.0.0"
requests = "^2.28.0"
pyarrow = "^21"
loguru = "^0.6.0"
tushare = "^1.2.89"
akshare = "^1.17.78"
efinance = "^0.5.5.2"
xgboost = "^3.4"
scikit-learn = "^1.6"
joblib = "^1.2.0"
tqdm = "^4.64.0"
scipy = "^1.13"
python-dateutil = "^2.8.2"
openpyxl = "^3.0.0"
dingtalk-stream = "^0.24.0"
gpiod = { version = "^1.5.0", markers = "sys_platform == 'linux'" }
psutil = "^5.9.0"
# SMB 远端读取通过系统 smbclient 命令实现（需 apt install smbclient）
# 无 Python SMB 库依赖

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
pytest-cov = "^4.0.0"
black = "^24.0.0"
flake8 = "^5.0.0"
isort = "^5.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
